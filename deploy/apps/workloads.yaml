apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: apps
  labels:
    app: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        zt-role: payments
      annotations:
        # CI only: a 2-minute workload certificate so rotation can be observed
        # inside one job. Every other workload keeps the 24h mesh default.
        proxy.istio.io/config: |
          proxyMetadata:
            SECRET_TTL: 2m
    spec:
      serviceAccountName: payments
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payments
          image: zt-shop:e2e
          imagePullPolicy: Never
          command: ["/usr/local/bin/payments"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: apps
  labels:
    app: payments
