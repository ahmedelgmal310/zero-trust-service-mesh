---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: fortio-server
  namespace: bench-mesh
spec:
  selector:
    matchLabels:
      app: fortio-server
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/bench-mesh/sa/fortio-client"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/echo"]
